name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Set up Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RbxTool.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RbxTool-debug
          path: app/build/outputs/apk/debug/RbxTool.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "RbxTool — Latest Build"
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/RbxTool.apk
          body: |
            Build otomatis dari commit terbaru.

            **Download langsung:**
            https://github.com/Kunsyy/KueKunsy/releases/latest/download/RbxTool.apk
